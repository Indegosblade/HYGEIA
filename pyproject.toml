[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hygeia"
version = "2.0.0"
description = "Forensic-grade PII sanitization for any platform — databases, configs, logs, images"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "Kevin Estrada", email = "estradakh@gmail.com"},
]
keywords = ["sanitization", "forensics", "security", "privacy", "pii", "hipaa", "gdpr", "ccpa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Indegosblade/HYGEIA"
Repository = "https://github.com/Indegosblade/HYGEIA"
Issues = "https://github.com/Indegosblade/HYGEIA/issues"

[project.scripts]
hygeia = "hygeia.cli:main"

[tool.setuptools.packages.find]
include = ["hygeia*"]

[tool.setuptools.package-data]
hygeia = ["rules/*.json"]
