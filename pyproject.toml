[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hygeia"
version = "3.15.0"
description = "Cross-platform forensic PII sanitization — 21 tested handlers for Chrome, Firefox, iOS, Android, Windows, macOS, Linux + generic SQLite/text scanning"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "Kevin Estrada", email = "estradakh@gmail.com"},
]
keywords = ["sanitization", "forensics", "security", "privacy", "pii", "hipaa", "gdpr", "ccpa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Indegosblade/HYGEIA"
Issues = "https://github.com/Indegosblade/HYGEIA/issues"

[project.scripts]
hygeia = "hygeia.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.10.6",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "bandit==1.9.4",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Preserve the established lint contract across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B404", "B405", "B314", "B603", "B607", "B608"]

[tool.setuptools.packages.find]
include = ["hygeia*"]

[tool.setuptools.package-data]
hygeia = ["rules/*.json"]
